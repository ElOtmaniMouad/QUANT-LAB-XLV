# Paramètres gelés du livrable D03 — Modèles économétriques (binôme B05 · XLV)
# Les périodes (train / validation / test) viennent de configs/data.yaml et ne sont PAS redéfinies ici.
# Toute modification de ce fichier doit être commitée et datée.

target:
  ticker: XLV            # actif prévu
  field: adj_close       # prix ajusté splits + dividendes (rendement total)
  kind: log_return       # cible : r_t = ln(P_t / P_{t-1})
  horizon: 1             # prévision à 1 séance : décision à la clôture t, cible r_{t+1}

exog:
  ticker: SPY            # variable externe de SARIMAX
  lag: 1                 # r^SPY retardé d'une séance (connu à la clôture précédente) : pas de fuite

baselines:
  moving_average_windows: [5, 20, 60]   # fenêtre retenue sur la VALIDATION (RMSE minimal)

arima:
  max_p: 3               # grille ARIMA(p, 0, q) sur les rendements ≡ ARIMA(p, 1, q) sur le log-prix
  max_q: 3
  trend: c               # constante (dérive du log-prix)

sarima:
  season: 5              # cycle hebdomadaire (5 séances) : seule saisonnalité plausible en journalier
  candidates:            # (P, D, Q) testés autour de l'ordre ARIMA retenu
    - [1, 0, 0]
    - [0, 0, 1]
    - [1, 0, 1]

walk_forward:
  window: expanding      # fenêtre croissante depuis le début du train (2018) : 2017 n'est jamais estimé
  refit_every: 21        # ré-estimation des paramètres toutes les 21 séances (~1 mois)
                         # entre deux ré-estimations : paramètres fixes, état filtré mis à jour chaque jour

# Sous-périodes du test final (cahier, section 8.2) — analyse de stabilité de la variante B05
test_subperiods:
  T1: {start: "2025-01-01", end: "2025-06-30"}
  T2: {start: "2025-07-01", end: "2025-12-31"}
  T3: {start: "2026-01-01", end: "2026-06-30"}
  T4: {start: "2026-07-01", end: "2026-10-30"}

diagnostics:
  ljung_box_lags: [5, 10, 20]
  arch_lm_lags: 5
  alpha: 0.05
